services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: storyseek-opensearch
    environment:
      - cluster.name=storyseek-cluster
      - node.name=storyseek-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    expose:
      - "9200"
      - "9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/build_index.py", "--recreate"]
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX_ALIAS: ${OPENSEARCH_INDEX_ALIAS:-storyseek_works}
      SENTENCE_TRANSFORMERS_HOME: /models
    volumes:
      - model-cache:/models
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX_ALIAS: ${OPENSEARCH_INDEX_ALIAS:-storyseek_works}
      BACKEND_URL: http://localhost/api
      SENTENCE_TRANSFORMERS_HOME: /models
    expose:
      - "8000"
    volumes:
      - model-cache:/models
    depends_on:
      opensearch:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile.prod
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/api}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  opensearch-data:
  model-cache:
