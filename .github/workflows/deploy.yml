name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60m
          command_timeout: 60m
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            REPO_URL="https://github.com/Hore-Files/StorySeek.git"
            BRANCH="main"

            mkdir -p "$DEPLOY_PATH"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              rm -rf "$DEPLOY_PATH"
              git clone --branch "$BRANCH" "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if command -v git-lfs >/dev/null 2>&1; then
              git lfs install --local
              git lfs pull
            else
              echo "git-lfs not installed on VPS; skipping LFS pull."
            fi

            cat > .env.prod <<'EOF'
            OPENSEARCH_INDEX_ALIAS=storyseek_works
            OPENSEARCH_CHUNKS_INDEX=storyseek_chunks
            DATA_PATH=${{ secrets.DATA_PATH || '/app/data/sample/works_gutenberg.jsonl' }}
            VITE_BACKEND_URL=/api
            WEB_PORT=${{ secrets.WEB_PORT || 8080 }}
            EOF

            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d opensearch
            docker compose -f docker-compose.prod.yml --env-file .env.prod build api indexer chunk-indexer frontend
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm --build indexer
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm --build chunk-indexer
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --build api frontend
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
            docker image prune -f
