services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: storyseek-opensearch
    environment:
      - cluster.name=storyseek-cluster
      - node.name=storyseek-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  indexer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/build_index.py", "--recreate"]
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX_ALIAS: storyseek_works
      SENTENCE_TRANSFORMERS_HOME: /models
    volumes:
      - model-cache:/models
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX_ALIAS: storyseek_works
      BACKEND_URL: http://localhost:8000
      SENTENCE_TRANSFORMERS_HOME: /models
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/models
    depends_on:
      opensearch:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "3001:3001"
    depends_on:
      - api

  # Uncomment to enable Dashboards UI on http://localhost:5601
  # opensearch-dashboards:
  #   image: opensearchproject/opensearch-dashboards:2.13.0
  #   container_name: storyseek-dashboards
  #   environment:
  #     - OPENSEARCH_HOSTS=["http://opensearch:9200"]
  #     - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
  #   ports:
  #     - "5601:5601"
  #   depends_on:
  #     - opensearch

volumes:
  opensearch-data:
  model-cache:
